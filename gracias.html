<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <meta http-equiv="refresh" content="6;url=https://chiquibakery.ca/" />
  <title>Thank You | Chiqui Bakery</title>
  <style>
    :root { --cream:#fff6ec; --pink:#eb7ac0; --chocolate:#3a241c; --coffee:#6f4433; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px; font-family:Arial,Helvetica,sans-serif; background:var(--cream); color:var(--chocolate); }
    main { position:relative; width:min(100%,600px); padding:130px 28px 36px; text-align:center; background:#fff; border-radius:18px; box-shadow:0 20px 60px rgba(58,36,28,.11); }
    .logo { position:absolute; top:24px; right:24px; width:125px; height:90px; object-fit:contain; }
    .heart { font-size:35px; color:var(--pink); line-height:1; margin-bottom:12px; }
    h1 { font-size:clamp(32px,6vw,46px); margin:0 0 14px; color:var(--chocolate); }
    .message { font-size:18px; line-height:1.65; color:var(--coffee); max-width:420px; margin:0 auto 28px; }
    .redirect { font-size:14px; color:var(--coffee); margin:0 0 14px; }
    .bar { width:180px; height:4px; background:#f6e6ed; border-radius:10px; overflow:hidden; margin:0 auto 26px; }
    .bar::before { content:""; display:block; width:100%; height:100%; background:var(--pink); transform-origin:left; animation:fill 6s linear forwards; }
    @keyframes fill { from { transform:scaleX(0); } to { transform:scaleX(1); } }
    a { display:inline-block; background:var(--pink); color:white; text-decoration:none; padding:13px 23px; border-radius:8px; font-weight:700; }
    a:hover { background:#b94f94; }
    @media(prefers-reduced-motion:reduce) { .bar::before { animation:none; } }
  </style>
</head>
<body>
  <main>
    <img class="logo" src="./images/chiqui_logo.png" alt="Chiqui Bakery logo" />
    <div class="heart" aria-hidden="true">♡</div>
    <h1>Thank you!</h1>
    <p class="message">We've received your message and will get back to you soon.</p>
    <p class="redirect">Redirecting you to our homepage...</p>
    <div class="bar" aria-hidden="true"></div>
    <a href="https://chiquibakery.ca/">Back to homepage</a>
  </main>
  <script>setTimeout(function(){window.location.replace("https://chiquibakery.ca/");},6000);</script>
</body>
</html>
